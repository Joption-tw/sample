<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>歷史時間價值比對</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
    .btn-active  { background-color: #2563eb !important; color: #fff !important; }
    .btn-active:hover { background-color: #1d4ed8 !important; }
    .chip {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
      background: #1e293b; color: #94a3b8; cursor: pointer; transition: all .15s;
      border: 1px solid #334155; user-select: none;
    }
    .chip:hover  { background: #293548; color: #e2e8f0; }
    .chip.active { background: #1e40af; color: #dbeafe; border-color: #3b82f6; }
    #chart-wrap { position: relative; }
    #loading-overlay {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; background: rgba(3,7,18,.7); z-index: 10;
      border-radius: 12px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #334155;
      border-top-color: #3b82f6; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .legend-line { display: inline-block; height: 2px; width: 22px; vertical-align: middle; margin-right: 4px; }
    .legend-dashed { background: none !important; border-top-width: 2px; border-top-style: dashed; }
    .legend-dotted { background: none !important; border-top-width: 2px; border-top-style: dotted; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-screen-xl mx-auto px-4 py-5">

  <!-- ── Header ─────────────────────────────────────────── -->
  <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">歷史時間價值比對</h1>
      <p class="text-gray-400 text-sm mt-0.5">週三／週五 即時與歷史時間價值疊圖分析</p>
    </div>
    <div class="flex items-center gap-3 mt-1">
      <span id="status" class="text-xs text-gray-400">--</span>
      <span id="last-update" class="text-xs text-gray-600"></span>
      <span id="countdown" class="text-xs text-gray-600"></span>
      <button onclick="manualRefresh()"
        class="px-3 py-1.5 rounded bg-gray-700 hover:bg-gray-600 text-sm text-white transition">
        ↻ 重新整理
      </button>
    </div>
  </div>

  <!-- ── Filters ─────────────────────────────────────────── -->
  <div class="space-y-2 mb-4">
    <!-- Series: 週三/週五 -->
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs text-gray-500 w-16 shrink-0">資料序列</span>
      <button id="s-all" onclick="setSession('all')" class="chip active">全部</button>
      <button id="s-wed" onclick="setSession('wed')" class="chip">週三盤</button>
      <button id="s-fri" onclick="setSession('fri')" class="chip">週五盤</button>
    </div>
    <!-- 10-盤 selector (dynamically populated) -->
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-xs text-gray-500 w-16 shrink-0">選　盤</span>
      <div id="ban-wrap" class="flex flex-wrap gap-1.5">
        <button onclick="setBan('all')" id="ban-all" class="chip active">全部</button>
      </div>
    </div>
  </div>

  <!-- ── 縮幅統計 ───────────────────────────────────────────── -->
  <div id="shrink-bar" class="flex flex-wrap gap-2 mb-3"></div>

  <!-- ── Chart ───────────────────────────────────────────── -->
  <div id="chart-wrap" class="rounded-xl border border-gray-700/60 overflow-hidden bg-gray-900">
    <div id="loading-overlay"><div class="spinner"></div></div>
    <div id="chart" style="height:580px;width:100%;"></div>
  </div>

  <!-- ── Legend ──────────────────────────────────────────── -->
  <div class="mt-4 flex flex-wrap gap-x-5 gap-y-2">
    <span class="text-xs text-gray-500 self-center">圖例：</span>
    <!-- Wed -->
    <span class="text-xs text-gray-300 flex items-center">
      <span class="legend-line" style="background:#ef4444;"></span>週三TX3（即時）
    </span>
    <span class="text-xs text-gray-300 flex items-center">
      <span class="legend-line legend-dashed" style="border-color:#f87171;"></span>週三TX2（前期）
    </span>
    <span class="text-xs text-gray-300 flex items-center">
      <span class="legend-line legend-dotted" style="border-color:#fca5a5;"></span>週三TX1（更前期）
    </span>
    <!-- Fri -->
    <span class="text-xs text-gray-300 flex items-center">
      <span class="legend-line" style="background:#16a34a;"></span>週五TXY（即時）
    </span>
    <span class="text-xs text-gray-300 flex items-center">
      <span class="legend-line legend-dashed" style="border-color:#4ade80;"></span>週五TXX（前期）
    </span>
    <span class="text-xs text-gray-300 flex items-center">
      <span class="legend-line legend-dotted" style="border-color:#86efac;"></span>週五TXV（更前期）
    </span>
    <span class="text-xs text-gray-500 self-center ml-2">｜實線=即時 虛線=前期 點線=更前期</span>
  </div>

  <p class="text-[11px] text-gray-600 mt-3 text-right">
    資料來源：Google Sheets · 異常值已自動修正 · 可滾輪縮放／拖曳平移
  </p>
</div>

<script>
/* ──────────────────────────────────────────────────────────
   常數
────────────────────────────────────────────────────────── */
const SHEET_ID = '1AsY4_MJipaMp_cNLpyeXTpFGnG0FD4vWJu-SDRdvtME';
const GID      = '710415505';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

// 欄位索引 (0-based)
const COL = {
  days: 0,   // A 剩餘天數
  time: 1,   // B 時間
  wedC: 2,   // C 週三TX3（即時）
  // D skip
  friE: 4,   // E 週五TXY（即時）
  wedF: 5,   // F 週三TX2（前期）
  wedG: 6,   // G 週三TX1（更前期）
  friH: 7,   // H 週五TXX（前期）
  friI: 8,   // I 週五TXV（更前期）
};

// lineType: 'solid' | [dash, gap] 陣列
const WED_SERIES = [
  { key: 'wedC', label: '週三TX3（即時）', color: '#ef4444', lineType: 'solid',   width: 3   },
  { key: 'wedF', label: '週三TX2（前期）', color: '#f87171', lineType: [12, 4],   width: 2   },
  { key: 'wedG', label: '週三TX1（更前期）',color: '#fca5a5', lineType: [2, 7],    width: 1.5 },
];
const FRI_SERIES = [
  { key: 'friE', label: '週五TXY（即時）', color: '#16a34a', lineType: 'solid',   width: 3   },
  { key: 'friH', label: '週五TXX（前期）', color: '#4ade80', lineType: [12, 4],   width: 2   },
  { key: 'friI', label: '週五TXV（更前期）',color: '#86efac', lineType: [2, 7],    width: 1.5 },
];

/* ──────────────────────────────────────────────────────────
   狀態
────────────────────────────────────────────────────────── */
let allRows     = [];
let currentSess = 'all';
let currentBan  = 'all';   // 'all' | '五-早' | '五-晚' | '四-早' ...
let chart       = null;

/* ──────────────────────────────────────────────────────────
   CSV 解析
────────────────────────────────────────────────────────── */
function parseCSVLine(line) {
  const res = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { res.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  res.push(cur.trim());
  return res;
}

function toNum(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isNaN(n) ? null : n;
}

/* ──────────────────────────────────────────────────────────
   異常值修正
   演算法：對每個非 null 點，若左右鄰居皆存在且
   該點偏離鄰居平均的幅度超過門檻（1.5%），則
   以鄰居平均替代；再做一次 3-point 平滑。
────────────────────────────────────────────────────────── */
function fixOutliers(arr, maxPct = 0.015) {
  const a = [...arr];
  for (let i = 1; i < a.length - 1; i++) {
    if (a[i] === null) continue;
    const prev = a[i - 1], next = a[i + 1];
    if (prev === null || next === null) continue;
    const avg = (prev + next) / 2;
    const thr = Math.max(150, Math.abs(avg) * maxPct);
    if (Math.abs(a[i] - avg) > thr) {
      a[i] = +(avg.toFixed(0));
    }
  }
  // 3-point smoothing (very light)
  const s = [...a];
  for (let i = 1; i < s.length - 1; i++) {
    if (a[i - 1] !== null && a[i] !== null && a[i + 1] !== null) {
      s[i] = +((a[i - 1] + a[i] * 2 + a[i + 1]) / 4).toFixed(1);
    }
  }
  return s;
}

/* ──────────────────────────────────────────────────────────
   篩選 & 建構圖表資料
────────────────────────────────────────────────────────── */
function getActiveSeries() {
  if (currentSess === 'wed') return WED_SERIES;
  if (currentSess === 'fri') return FRI_SERIES;
  return [...WED_SERIES, ...FRI_SERIES];
}

function isEarlySession(timeStr) {
  const m = String(timeStr || '').trim().match(/^(\d{1,2}):/);
  if (!m) return true;
  const h = parseInt(m[1]);
  return h >= 6 && h < 14;   // 06:00–13:59 早盤，其餘晚盤
}

function buildChartData() {
  let rows = allRows;
  if (currentBan !== 'all') {
    const [day, sess] = currentBan.split('-');
    const wantEarly = sess === '早';
    rows = rows.filter(r =>
      String(r[COL.days]).trim() === day &&
      isEarlySession(r[COL.time]) === wantEarly
    );
  }

  const xLabels = rows.map(r => {
    const d = String(r[COL.days] || '').trim();
    const t = String(r[COL.time] || '').trim();
    return `${d}天 ${t}`;
  });

  const series = getActiveSeries().map(def => {
    const colIdx = COL[def.key];
    const rawVals = rows.map(r => toNum(r[colIdx]));
    const cleaned = fixOutliers(rawVals);
    return {
      name: def.label,
      type: 'line',
      data: cleaned,
      symbol: 'none',
      connectNulls: false,
      lineStyle: {
        color: def.color,
        width: def.width,
        type: def.lineType,
      },
      itemStyle: { color: def.color },
      emphasis: { scale: false },
    };
  });

  return { xLabels, series };
}

/* ──────────────────────────────────────────────────────────
   ECharts 初始化
────────────────────────────────────────────────────────── */
function initChart() {
  chart = echarts.init(document.getElementById('chart'), null, { renderer: 'canvas' });
  window.addEventListener('resize', () => chart.resize());
}

function renderChart() {
  if (!chart || allRows.length === 0) return;
  const { xLabels, series } = buildChartData();
  const hasData = series.some(s => s.data.some(v => v !== null));

  const option = {
    backgroundColor: '#0f172a',
    animation: false,

    tooltip: {
      trigger: 'axis',
      backgroundColor: '#1e293b',
      borderColor: '#334155',
      padding: [8, 12],
      textStyle: { color: '#e2e8f0', fontSize: 12, fontFamily: 'inherit' },
      extraCssText: 'box-shadow:0 4px 16px rgba(0,0,0,.5);border-radius:8px;',
      formatter(params) {
        if (!params.length) return '';
        let html = `<div style="font-weight:600;margin-bottom:6px;color:#94a3b8;font-size:11px">${params[0].name}</div>`;
        params.forEach(p => {
          if (p.value === null || p.value === undefined) return;
          html += `
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              <span style="display:inline-block;width:10px;height:3px;background:${p.color};border-radius:2px;"></span>
              <span style="color:#94a3b8;font-size:11px;min-width:140px">${p.seriesName}</span>
              <span style="font-weight:600;color:#f1f5f9;font-variant-numeric:tabular-nums">${Number(p.value).toLocaleString()}</span>
            </div>`;
        });
        return html;
      }
    },

    legend: {
      show: false,  // 使用自訂圖例
    },

    grid: {
      left: 100, right: 20, top: 24, bottom: 80,
      containLabel: false,
    },

    xAxis: {
      type: 'category',
      data: xLabels,
      boundaryGap: false,
      axisLabel: {
        color: '#475569',
        fontSize: 10,
        rotate: 30,
        interval: Math.max(0, Math.floor(xLabels.length / 40)),
      },
      axisLine:  { lineStyle: { color: '#1e293b' } },
      axisTick:  { lineStyle: { color: '#1e293b' } },
      splitLine: { show: false },
    },

    yAxis: {
      type: 'value',
      position: 'left',
      axisLabel: {
        color: '#475569',
        fontSize: 11,
        formatter: v => v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v,
      },
      splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } },
      axisLine:  { show: false },
      axisTick:  { show: false },
    },

    dataZoom: [
      // X 軸 — 滾輪／拖曳
      {
        type: 'inside',
        xAxisIndex: 0,
        start: 0, end: 100,
        zoomOnMouseWheel: true,
        moveOnMouseMove: true,
      },
      // X 軸 — 底部拉桿
      {
        type: 'slider',
        xAxisIndex: 0,
        height: 22,
        bottom: 16,
        borderColor: '#1e293b',
        backgroundColor: '#0f172a',
        fillerColor: 'rgba(37,99,235,.25)',
        handleStyle: { color: '#3b82f6', borderColor: '#3b82f6' },
        moveHandleStyle: { color: '#3b82f6' },
        emphasis: { handleStyle: { color: '#60a5fa' } },
        textStyle: { color: '#475569', fontSize: 10 },
        dataBackground: {
          lineStyle: { color: '#334155' },
          areaStyle: { color: '#1e293b' },
        },
      },
      // Y 軸 — 滾輪（Shift+滾輪）
      {
        type: 'inside',
        yAxisIndex: 0,
        start: 0, end: 100,
        zoomOnMouseWheel: 'shift',
        moveOnMouseMove: false,
      },
      // Y 軸 — 左側垂直拉桿
      {
        type: 'slider',
        yAxisIndex: 0,
        width: 22,
        left: 8,
        borderColor: '#1e293b',
        backgroundColor: '#0f172a',
        fillerColor: 'rgba(37,99,235,.25)',
        handleStyle: { color: '#3b82f6', borderColor: '#3b82f6' },
        moveHandleStyle: { color: '#3b82f6' },
        emphasis: { handleStyle: { color: '#60a5fa' } },
        textStyle: { color: '#475569', fontSize: 10 },
        dataBackground: {
          lineStyle: { color: '#334155' },
          areaStyle: { color: '#1e293b' },
        },
      },
    ],

    series: hasData ? series : [],
  };

  chart.setOption(option, true);
  updateShrinkBar(getActiveSeries(), series);
}

/* ──────────────────────────────────────────────────────────
   10-盤按鈕（動態）
────────────────────────────────────────────────────────── */
function buildBanButtons() {
  const ORDER = [
    { day: '五', sess: '晚' },
    { day: '四', sess: '早' }, { day: '四', sess: '晚' },
    { day: '三', sess: '早' }, { day: '三', sess: '晚' },
    { day: '二', sess: '早' }, { day: '二', sess: '晚' },
    { day: '一', sess: '早' }, { day: '一', sess: '晚' },
    { day: '零', sess: '早' },
  ];

  const wrap = document.getElementById('ban-wrap');
  wrap.innerHTML = '<button onclick="setBan(\'all\')" id="ban-all" class="chip active">全部</button>';

  ORDER.forEach(({ day, sess }) => {
    const wantEarly = sess === '早';
    const hasData = allRows.some(r =>
      String(r[COL.days]).trim() === day &&
      isEarlySession(r[COL.time]) === wantEarly
    );
    if (!hasData) return;
    const key = `${day}-${sess}`;
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.id = `ban-${key}`;
    btn.textContent = `${day}天${sess}盤`;
    btn.onclick = () => setBan(key);
    wrap.appendChild(btn);
  });
}

/* ──────────────────────────────────────────────────────────
   互動控制
────────────────────────────────────────────────────────── */
function setSession(sess) {
  currentSess = sess;
  ['all', 'wed', 'fri'].forEach(s => {
    document.getElementById(`s-${s}`)?.classList.toggle('active', s === sess);
  });
  renderChart();
}

function setBan(key) {
  currentBan = key;
  document.querySelectorAll('.chip[id^="ban-"]').forEach(el => {
    el.classList.toggle('active', el.id === `ban-${key}`);
  });
  renderChart();
}

/* ──────────────────────────────────────────────────────────
   縮幅計算
────────────────────────────────────────────────────────── */
function calcShrink(vals) {
  const v = vals.filter(x => x !== null && x !== undefined);
  if (v.length < 2) return null;
  return v[0] - v[v.length - 1];   // 開盤 − 收盤（正值＝縮水）
}

function updateShrinkBar(seriesList, builtSeries) {
  const bar = document.getElementById('shrink-bar');
  bar.innerHTML = '';

  seriesList.forEach((def, i) => {
    const shrink = calcShrink(builtSeries[i].data);
    if (shrink === null) return;

    const isWed   = def.key.startsWith('wed');
    const baseClr = isWed ? '#ef4444' : '#16a34a';
    const bgClr   = isWed ? 'rgba(239,68,68,.1)' : 'rgba(22,163,74,.1)';
    const bdrClr  = isWed ? 'rgba(239,68,68,.3)' : 'rgba(22,163,74,.3)';

    // 縮幅正值＝時間價值縮水（正常），負值＝膨脹
    const sign    = shrink >= 0 ? '▼' : '▲';
    const valClr  = shrink >= 0 ? baseClr : '#facc15';
    const abs     = Math.abs(shrink).toLocaleString('zh-TW', { maximumFractionDigits: 0 });

    const card = document.createElement('div');
    card.style.cssText = `
      display:inline-flex;flex-direction:column;align-items:center;
      padding:6px 14px;border-radius:8px;min-width:100px;
      background:${bgClr};border:1px solid ${bdrClr};
    `;
    card.innerHTML = `
      <span style="font-size:10px;color:#94a3b8;margin-bottom:2px;white-space:nowrap">${def.label}</span>
      <span style="font-size:16px;font-weight:700;color:${valClr};font-variant-numeric:tabular-nums">
        ${sign} ${abs}
      </span>
      <span style="font-size:10px;color:#64748b">點</span>
    `;
    bar.appendChild(card);
  });
}

/* ──────────────────────────────────────────────────────────
   資料載入
────────────────────────────────────────────────────────── */
function setStatus(msg, ok = true) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = ok ? '#64748b' : '#f87171';
}

function showLoading(v) {
  document.getElementById('loading-overlay').style.display = v ? 'flex' : 'none';
}

async function loadData() {
  showLoading(true);
  setStatus('資料載入中…');
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const lines = text.trim().split(/\r?\n/);

    // 第一行通常是標題列，直接跳過
    const dataLines = lines.slice(1);
    allRows = dataLines
      .map(l => parseCSVLine(l))
      .filter(r => r.length >= 3 && r[COL.days] && r[COL.time]);

    buildBanButtons();
    setStatus(`已載入 ${allRows.length} 筆資料`);
    setLastUpdate();
    renderChart();
  } catch (e) {
    setStatus(`載入失敗：${e.message}`, false);
    console.error(e);
  } finally {
    showLoading(false);
  }
}

/* ──────────────────────────────────────────────────────────
   自動更新（每 2 分鐘）
────────────────────────────────────────────────────────── */
const AUTO_INTERVAL = 120;   // 秒
let countdownSec = AUTO_INTERVAL;
let countdownTimer = null;

function updateCountdown() {
  const el = document.getElementById('countdown');
  if (!el) return;
  const m = Math.floor(countdownSec / 60);
  const s = String(countdownSec % 60).padStart(2, '0');
  el.textContent = `${m}:${s} 後更新`;
  countdownSec--;
  if (countdownSec < 0) {
    countdownSec = AUTO_INTERVAL;
    loadData();
  }
}

function startAutoRefresh() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownSec = AUTO_INTERVAL;
  countdownTimer = setInterval(updateCountdown, 1000);
}

function manualRefresh() {
  countdownSec = AUTO_INTERVAL;
  loadData();
}

function setLastUpdate() {
  const el = document.getElementById('last-update');
  if (!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  el.textContent = `更新於 ${hh}:${mm}:${ss}`;
}

/* ──────────────────────────────────────────────────────────
   啟動
────────────────────────────────────────────────────────── */
initChart();
loadData();
startAutoRefresh();
</script>
</body>
</html>
